name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate skill layout and metadata
        shell: pwsh
        run: ./scripts/Test-Skills.ps1

      - name: Verify validator rejects broken fixtures
        shell: pwsh
        run: ./scripts/Test-ValidatorMutations.ps1

      - name: Check changed-line whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Check bundled shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find skills -path '*/scripts/*.sh' -print0)
